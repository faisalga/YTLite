name: Build Tweaks (Helper)

on:
  workflow_call:
    inputs:
      enable_youpip:
        type: boolean
        required: true
        default: false
      enable_ytuhd:
        type: boolean
        required: true
        default: false
      enable_yq:
        type: boolean
        required: true
        default: false
      enable_ryd:
        type: boolean
        required: true
        default: false
      enable_ytabc:
        type: boolean
        required: true
        default: false
      enable_demc:
        type: boolean
        required: true
        default: false
      tweak_version:
        type: string
        required: false
        default: ""
      tweak_url:
        type: string
        required: false
        default: ""

jobs:
  build-tweaks:
    name: Build Tweaks
    runs-on: macos-latest

    steps:
      - name: Checkout YTLite source (this fork's custom branch)
        uses: actions/checkout@v6
        with:
          ref: custom

      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5
        env:
          cache-name: theos_cache_9bc7340_v2
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      # ----------------------------------------------------------------
      # Get the paid YTLite .deb (full feature set, contains paywall).
      # Our YTLBypass tweak (built next) disables the runtime gating.
      # ----------------------------------------------------------------
      - name: Download YouTube Plus (paid .deb — full features)
        if: ${{ inputs.tweak_version != '' }}
        run: |
          deb_url="https://github.com/dayanch96/YTLite/releases/download/v${{ inputs.tweak_version }}/com.dvntm.ytlite_${{ inputs.tweak_version }}_iphoneos-arm.deb"
          wget "$deb_url" --no-verbose -O ytplus.deb
          ls -la ytplus.deb

      - name: Download YouTube Plus (by URL — beta override)
        if: ${{ inputs.tweak_url != '' }}
        run: |
          wget "${{ inputs.tweak_url }}" --no-verbose -O ytplus.deb
          file_type=$(file --mime-type -b ytplus.deb)
          if [[ "$file_type" != "application/vnd.debian.binary-package" ]]; then
            echo "::error::Validation failed: not a valid DEB. Detected: $file_type"
            exit 1
          fi

      - name: Extract YTLite.bundle from the downloaded deb (settings UI resources)
        run: |
          # cyan extracts the .dylib from a .deb but doesn't carry bundle resources.
          # Extract YTLite.bundle (localizations, icons, audio) so cyan can inject it.
          # Without this the YTLite settings UI renders raw L10n keys.
          mkdir -p /tmp/ytl_deb_extract
          (cd /tmp/ytl_deb_extract && ar -x "$GITHUB_WORKSPACE/ytplus.deb" && tar -xf data.tar*)
          if [ -d "/tmp/ytl_deb_extract/Library/Application Support/YTLite.bundle" ]; then
            cp -r "/tmp/ytl_deb_extract/Library/Application Support/YTLite.bundle" "$GITHUB_WORKSPACE/YTLite.bundle"
            echo "Extracted YTLite.bundle for cyan injection:"
            ls "$GITHUB_WORKSPACE/YTLite.bundle/" | head -10
          else
            echo "::warning::YTLite.bundle not found in paid deb"
            find /tmp/ytl_deb_extract -name "*.bundle" -type d 2>/dev/null | head
          fi

      # ----------------------------------------------------------------
      # Build YTLBypass — our paywall-disabling tweak. Compiles
      # bypass/Tweak.x against PoomSmart's YouTubeHeader for class refs.
      # ----------------------------------------------------------------
      - name: Clone YouTubeHeader (used by YTLBypass + integration tweaks)
        run: |
          if [ -d "$THEOS/include/YouTubeHeader" ]; then
            cd $THEOS/include/YouTubeHeader && git pull
          else
            cd $THEOS/include && git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          fi
          if [ "${{ inputs.enable_demc }}" = "true" ]; then
            rm -rf "$THEOS/include/YTHeaders"
            cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          fi

      - name: Clone PSHeader (used by some integration tweaks)
        run: |
          if [ -d "$THEOS/include/PSHeader" ]; then
            cd $THEOS/include/PSHeader && git pull
          else
            cd $THEOS/include && git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
          fi

      - name: Build YTLBypass (paywall-disabling sibling tweak)
        run: |
          cd bypass
          make clean package DEBUG=0 FINALPACKAGE=1
          ls -la packages/
          DEB=$(ls packages/*iphoneos-arm.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then DEB=$(ls packages/*.deb | head -1); fi
          if [ -z "$DEB" ]; then
            echo "::error::YTLBypass: no .deb produced"
            exit 1
          fi
          cp "$DEB" "$GITHUB_WORKSPACE/ytlbypass.deb"
          echo "Built YTLBypass: $DEB -> ytlbypass.deb"

      # ----------------------------------------------------------------
      # Optional integration tweaks (PoomSmart's open-source ones).
      # These are built from source on each run.
      # ----------------------------------------------------------------
      - name: Clone YouPiP
        if: ${{ inputs.enable_youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git

      - name: Clone Return-YouTube-Dislikes
        if: ${{ inputs.enable_ryd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone YTABConfig
        if: ${{ inputs.enable_ytabc }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git

      - name: Clone YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_demc }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git

      - name: Clone YouQuality
        if: ${{ inputs.enable_yq }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git

      - name: Clone YTVideoOverlay
        if: ${{ inputs.enable_yq || inputs.enable_youpip || inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Clone DontEatMyContent
        if: ${{ inputs.enable_demc }}
        run: git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      - name: Build YouPiP
        if: ${{ inputs.enable_youpip }}
        run: |
          cd YouPiP && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/youpip.deb

      - name: Build YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: |
          cd YTUHD && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/ytuhd.deb

      - name: Build Return-YouTube-Dislikes
        if: ${{ inputs.enable_ryd }}
        run: |
          cd Return-YouTube-Dislikes && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/ryd.deb

      - name: Build YTABConfig
        if: ${{ inputs.enable_ytabc }}
        run: |
          cd YTABConfig && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/ytabc.deb

      - name: Build YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_demc }}
        run: |
          cd YouGroupSettings && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/ygs.deb

      - name: Build YouQuality
        if: ${{ inputs.enable_yq }}
        run: |
          cd YouQuality && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/yq.deb

      - name: Build YTVideoOverlay
        if: ${{ inputs.enable_yq || inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          cd YTVideoOverlay && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/ytvo.deb

      - name: Build DontEatMyContent
        if: ${{ inputs.enable_demc }}
        run: |
          cd DontEatMyContent && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb $GITHUB_WORKSPACE/demc.deb

      - name: Clone Open in YouTube (Safari extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension
          cd OpenYoutubeSafariExtension
          git sparse-checkout set --no-cone OpenYoutubeSafariExtension.appex
          git checkout
          mv *.appex $GITHUB_WORKSPACE/

      - name: Upload built debs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: |
            *.deb
            *.appex
          if-no-files-found: error
          retention-days: 1
